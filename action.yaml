name: nix flake release
description: release all packages in a nix flake
author: trev

inputs:
  packages:
    description: nix packages to release
    required: false

  git_type:
    description: type of git server (github, gitea, forgejo)
    required: false

  github_repository:
    description: github repository in the form owner/repo
    required: false
    default: ${{ github.repository }}

  github_server_url:
    description: github server url
    required: false
    default: ${{ github.server_url }}

  github_actor:
    description: github actor
    required: false
    default: ${{ github.actor }}

  github_token:
    description: github token
    required: false
    default: ${{ github.token }}

  publish_packages:
    description: language package kinds to publish (go, cargo, gradle, maven, npm, pypi)
    required: false

  package_registry_owner:
    description: package registry owner or namespace
    required: false

  package_registry_url:
    description: package registry server or npm/maven registry url override
    required: false

  package_registry_username:
    description: package registry username
    required: false

  package_registry_token:
    description: dedicated package registry write token
    required: false

  registry:
    description: container registry url
    required: false
    default: ghcr.io

  registry_username:
    description: container registry username
    required: false
    default: ${{ github.actor }}

  registry_password:
    description: container registry password
    required: false
    default: ${{ github.token }}

  delete_old_release_artifacts:
    description: delete release assets and image tags from previous releases after creating a new release
    required: false
    default: "false"

runs:
  using: docker
  image: docker://ghcr.io/spotdemo4/nix-flake-release:0.17.0
  env:
    PACKAGES: ${{ inputs.packages }}
    GIT_TYPE: ${{ inputs.git_type }}
    GITHUB_REPOSITORY: ${{ inputs.github_repository }}
    GITHUB_SERVER_URL: ${{ inputs.github_server_url }}
    GITHUB_ACTOR: ${{ inputs.github_actor }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
    REGISTRY: ${{ inputs.registry }}
    REGISTRY_USERNAME: ${{ inputs.registry_username }}
    REGISTRY_PASSWORD: ${{ inputs.registry_password }}
    PUBLISH_PACKAGES: ${{ inputs.publish_packages }}
    PACKAGE_REGISTRY_OWNER: ${{ inputs.package_registry_owner }}
    PACKAGE_REGISTRY_URL: ${{ inputs.package_registry_url }}
    PACKAGE_REGISTRY_TOKEN: ${{ inputs.package_registry_token }}
    PACKAGE_REGISTRY_USERNAME: ${{ inputs.package_registry_username }}
    DELETE_OLD_RELEASE_ARTIFACTS: ${{ inputs.delete_old_release_artifacts }}
