name: nix flake release
description: release all packages in a nix flake
author: trev

inputs:
  packages:
    description: nix packages to release
    required: false

  git_type:
    description: type of git server (github, gitea, forgejo)
    required: false

  git_repository:
    description: git repository in the form owner/repo
    required: false
    default: ${{ github.repository }}

  git_server_url:
    description: git server url
    required: false
    default: ${{ github.server_url }}

  git_actor:
    description: git user
    required: false
    default: ${{ github.actor }}

  git_token:
    description: git token used to push releases
    required: false
    default: ${{ github.token }}

  github_repository:
    description: deprecated; use git_repository
    required: false
    deprecationMessage: github_repository is deprecated; use git_repository instead

  github_server_url:
    description: deprecated; use git_server_url
    required: false
    deprecationMessage: github_server_url is deprecated; use git_server_url instead

  github_actor:
    description: deprecated; use git_actor
    required: false
    deprecationMessage: github_actor is deprecated; use git_actor instead

  github_token:
    description: github.com token used by Nix; on github.com, also used to push releases instead of git_token
    required: false

  publish_packages:
    description: deprecated; discovered packages are published when package_registry_token is set
    required: false
    deprecationMessage: publish_packages is deprecated; discovered packages are published when package_registry_token is set

  package_registry_owner:
    description: package registry owner or namespace
    required: false

  package_registry_url:
    description: package registry server or npm/maven registry url override
    required: false

  package_registry_username:
    description: package registry username
    required: false

  package_registry_token:
    description: dedicated package registry write token; enables package publishing
    required: false

  container_registry:
    description: container registry url
    required: false

  container_registry_username:
    description: container registry username
    required: false
    default: ${{ github.actor }}

  container_registry_password:
    description: container registry password
    required: false
    default: ${{ github.token }}

  registry:
    description: deprecated; use container_registry
    required: false
    deprecationMessage: registry is deprecated; use container_registry instead

  registry_username:
    description: deprecated; use container_registry_username
    required: false
    deprecationMessage: registry_username is deprecated; use container_registry_username instead

  registry_password:
    description: deprecated; use container_registry_password
    required: false
    deprecationMessage: registry_password is deprecated; use container_registry_password instead

  delete_old_release_artifacts:
    description: "cleanup release assets and image tags after publishing: false disables, true keeps current, a positive number keeps that many releases including current"
    required: false
    default: "false"

  bundle_appimage:
    description: bundle eligible Linux script packages as AppImages
    required: false
    default: "false"

runs:
  using: docker
  image: docker://ghcr.io/spotdemo4/flake-release:0.36.0
  env:
    PACKAGES: ${{ inputs.packages }}
    GIT_TYPE: ${{ inputs.git_type }}
    GIT_REPOSITORY: ${{ inputs.github_repository || inputs.git_repository }}
    GIT_SERVER_URL: ${{ inputs.github_server_url || inputs.git_server_url }}
    GIT_ACTOR: ${{ inputs.github_actor || inputs.git_actor }}
    GIT_TOKEN: ${{ (inputs.github_server_url || inputs.git_server_url) == 'https://github.com' && inputs.github_token || inputs.git_token }}
    # git_token is only a github.com token when releasing to github.com
    GITHUB_TOKEN: ${{ inputs.github_token || ((inputs.github_server_url || inputs.git_server_url) == 'https://github.com' && inputs.git_token) || '' }}
    CONTAINER_REGISTRY: ${{ inputs.registry || inputs.container_registry }}
    CONTAINER_REGISTRY_USERNAME: ${{ inputs.registry_username || inputs.container_registry_username }}
    CONTAINER_REGISTRY_PASSWORD: ${{ inputs.registry_password || inputs.container_registry_password }}
    REGISTRY: ${{ inputs.registry }}
    REGISTRY_USERNAME: ${{ inputs.registry_username }}
    REGISTRY_PASSWORD: ${{ inputs.registry_password }}
    PUBLISH_PACKAGES: ${{ inputs.publish_packages }}
    PACKAGE_REGISTRY_OWNER: ${{ inputs.package_registry_owner }}
    PACKAGE_REGISTRY_URL: ${{ inputs.package_registry_url }}
    PACKAGE_REGISTRY_TOKEN: ${{ inputs.package_registry_token }}
    PACKAGE_REGISTRY_USERNAME: ${{ inputs.package_registry_username }}
    DELETE_OLD_RELEASE_ARTIFACTS: ${{ inputs.delete_old_release_artifacts }}
    BUNDLE_APPIMAGE: ${{ inputs.bundle_appimage }}
