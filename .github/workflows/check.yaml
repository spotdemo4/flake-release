name: check

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@c0118a341dad06b0c0f7f28431255fec42a62336 # v1.70.0

      - name: Run checks
        run: nix flake check
